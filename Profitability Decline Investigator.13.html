<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profitability Decline Investigator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Newsreader:wght@600&display=swap">
<style>
:root{--bg:#f1efeb;--pn:#fff;--ink:#1d2430;--mut:#667085;--ln:#dcd8d0;--ac:#1f4e8c;--bad:#b42318;--ok:#2e7d4f;--wn:#b7791f;--soft:#e8eef7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--pn:#1b212a;--ink:#e8ebf0;--mut:#98a2b3;--ln:#2d3541;--ac:#6ea2e8;--bad:#f97066;--ok:#5fc48a;--wn:#f2b84b;--soft:#1c2a3f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--pn:#1b212a;--ink:#e8ebf0;--mut:#98a2b3;--ln:#2d3541;--ac:#6ea2e8;--bad:#f97066;--ok:#5fc48a;--wn:#f2b84b;--soft:#1c2a3f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Public Sans",system-ui,sans-serif}
header{background:var(--pn);border-bottom:1px solid var(--ln);padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
h1{font:600 23px "Newsreader",Georgia,serif;margin:0}h2{font-size:13px;margin:0 0 10px}.sub{color:var(--mut);font-size:12px}
main{max-width:1400px;margin:auto;padding:14px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:14px;margin-bottom:12px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kp{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:10px 12px}.kp b{display:block;font-size:22px}.kp span{font-size:12px;color:var(--mut)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:960px){.g{grid-template-columns:1fr}}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:480px}
th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right}th:first-child,td:first-child{text-align:left}
.hm td{text-align:center;padding:5px 3px;cursor:pointer;min-width:34px;font-size:11px}.hm td:first-child{cursor:default;white-space:nowrap}
.pill{padding:1px 8px;border-radius:9px;font-size:11px;font-weight:600;color:#fff}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:12.5px}
.bar i{display:block;height:12px;border-radius:3px}.bar div:nth-child(2){background:var(--bg);border-radius:3px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.nd{border:1px solid var(--ln);border-radius:6px;padding:7px 9px;font-size:12px;background:var(--soft);min-width:110px}.nd b{display:block;font-size:14px}.ar{align-self:center;color:var(--mut)}
label{display:flex;justify-content:space-between;font-size:12px;margin-top:10px}label output{font-weight:600;color:var(--ac)}input[type=range]{width:100%;accent-color:var(--ac)}
.chat{height:260px;overflow:auto;border:1px solid var(--ln);border-radius:6px;padding:8px;background:var(--bg)}
.m{margin:0 0 8px;padding:7px 10px;border-radius:8px;max-width:94%;white-space:pre-wrap;font-size:13px}.m.a{background:var(--pn);border:1px solid var(--ln)}.m.u{background:var(--ac);color:#fff;margin-left:auto}
.ask{display:flex;gap:6px;margin:8px 0}.ask input{flex:1;padding:7px 9px;border:1px solid var(--ln);border-radius:6px;background:var(--pn);color:var(--ink);font:inherit}
.row{display:flex;gap:6px;flex-wrap:wrap}svg text{fill:var(--mut);font-size:10px;font-family:inherit}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
</style></head><body>
<header><div><h1>Profitability Decline Investigator</h1><div class="sub">Marketing, HR, Operations and Finance data joined into one view · 8 quarters · ₹ in lakhs (assumed data)</div></div><button id="th">Toggle theme</button></header>
<main>
<div class="tabs" id="tabs"></div>
<section id="t0"></section><section id="t1" hidden></section><section id="t2" hidden></section><section id="t3" hidden></section>
<div class="card"><h2>AI business analyst</h2><div class="chat" id="chat" aria-live="polite"></div>
<div class="ask"><input id="q" placeholder="Ask: why did profit fall? · correlation between overtime and defects · who is responsible? · recommend a fix" aria-label="Ask the analyst"><button class="p" id="go">Ask</button></div>
<div class="row"><button data-q="Why did profit fall?">Why did profit fall?</button><button data-q="Which department is responsible?">Who is responsible?</button><button data-q="What is the correlation between discount and attrition?">Discount vs attrition</button><button data-q="When did the problem start?">When did it start?</button><button data-q="Recommend a fix">Recommend a fix</button></div></div>
</main>
<script>
const Q=["Q4’24","Q1’25","Q2’25","Q3’25","Q4’25","Q1’26","Q2’26","Q3’26"];
const B={disc:[5,5,6,6,7,10,12,14],mspend:[60,62,64,66,70,82,95,108],leads:[4200,4300,4500,4700,5000,5900,6700,7400],conv:[8.2,8.3,8.3,8.4,8.4,8,7.5,7.1],util:[78,80,82,84,87,93,97,99],defect:[2,2,2.1,2.1,2.2,3.4,4.6,5.8],otd:[95,95,94,94,94,90,87,84],hc:[210,212,215,220,226,248,270,292],attr:[8,8,9,9,10,15,19,23],train:[24,24,24,22,22,14,10,8],ot:[6,6,7,8,9,18,26,32],dso:[38,38,39,39,40,46,52,58]};
const R=Q.map((q,i)=>{const g=k=>B[k][i],o=g('leads')*g('conv')/100,list=o*2.4,rev=list*(1-g('disc')/100),cogs=list*.38,sal=g('hc')*.75,otc=g('hc')*g('ot')*3*.0012,mk=g('mspend'),ret=list*g('defect')/100*.7,exp=Math.max(0,(95-g('otd'))*1.5),ph=i?B.hc[i-1]:g('hc'),hires=Math.max(0,g('hc')-ph)+g('hc')*g('attr')/400,rec=hires*.6,fin=rev*g('dso')/90*.03,fix=100,profit=rev-cogs-sal-otc-mk-ret-exp-rec-fin-fix;return{q,o,list,rev,cogs,sal,otc,mk,ret,exp,rec,fin,fix,profit,m:profit/rev*100}});
const M=[['disc','Discount %','Marketing',B.disc],['mspend','Marketing spend','Marketing',B.mspend],['leads','Leads','Marketing',B.leads],['util','Capacity utilization %','Operations',B.util],['defect','Defect/return rate %','Operations',B.defect],['otd','On-time delivery %','Operations',B.otd],['ot','Overtime hrs/emp','HR',B.ot],['attr','Attrition %','HR',B.attr],['train','Training hrs/emp','HR',B.train],['dso','Receivable days','Finance',B.dso],['margin','Net margin %','Finance',R.map(r=>r.m)]];
const ALIAS={disc:/discount|promo/,mspend:/spend|campaign/,leads:/lead/,util:/utili|capacity/,defect:/defect|return|quality/,otd:/deliver|otd/,ot:/overtime/,attr:/attrition|turnover|resign/,train:/training/,dso:/receivable|dso|collection/,margin:/margin|profit/};
const DC={Marketing:'#1f4e8c',HR:'#8a4fb5',Operations:'#b7791f',Finance:'#2e7d4f'};
const $=id=>document.getElementById(id),f=(n,d=0)=>n.toLocaleString('en-IN',{maximumFractionDigits:d}),L=R.length-1,PK=4;
const sg=n=>(n>=0?'+':'−')+f(Math.abs(n),0);
function corr(a,b){const n=a.length,ma=a.reduce((x,y)=>x+y)/n,mb=b.reduce((x,y)=>x+y)/n;let s=0,x=0,y=0;for(let i=0;i<n;i++){s+=(a[i]-ma)*(b[i]-mb);x+=(a[i]-ma)**2;y+=(b[i]-mb)**2}return s/Math.sqrt(x*y)}
function line(series,idx,h=230){const W=620,Lm=40,Bm=22,all=series.flatMap(s=>idx?s.v.map(v=>v/s.v[0]*100):s.v),mn=Math.min(...all),mx=Math.max(...all),pad=(mx-mn)*.08,lo=mn-pad,hi=mx+pad,x=i=>Lm+i*(W-Lm-10)/(Q.length-1),y=v=>h-Bm-(v-lo)/(hi-lo)*(h-Bm-10);let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line x1="${Lm}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="3" y="${y(v)+3}">${f(v)}</text>`}
return`<svg viewBox="0 0 ${W} ${h}" width="100%" role="img">${g}${Q.map((q,i)=>`<text x="${x(i)-14}" y="${h-6}">${q}</text>`).join('')}${series.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="2.3" points="${s.v.map((v,i)=>x(i)+','+y(idx?v/s.v[0]*100:v)).join(' ')}"/>`).join('')}</svg><div class="leg">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}</div>`}
const d=(k)=>R[L][k]-R[PK][k];
const D={disc:R[L].o*2.4*(B.disc[L]-B.disc[PK])/100,hr:d('otc')+d('rec'),qual:d('ret')+d('exp'),fin:d('fin'),mk:d('mk')},dP=R[L].profit-R[PK].profit,VOL=dP+D.disc+D.hr+D.qual+D.fin+D.mk;
const DRV=[['Discount giveaway (Marketing)',-D.disc],['Overtime and turnover cost (HR)',-D.hr],['Returns and late-delivery cost (Operations)',-D.qual],['Slow collections (Finance)',-D.fin],['Higher marketing spend',-D.mk],['Net gain from extra volume',VOL]];
function ov(){const r=R[L],p=R[PK],bad=3;$('t0').innerHTML=`<div class="k"><div class="kp"><b style="color:var(--bad)">${f(r.m,1)}%</b><span>Net margin ${Q[L]} (peak ${f(p.m,1)}%)</span></div><div class="kp"><b style="color:var(--bad)">₹${f(r.profit)}L</b><span>Net profit (${sg(dP)}L vs peak)</span></div><div class="kp"><b>${bad}</b><span>Consecutive quarters of decline</span></div><div class="kp"><b style="color:var(--ok)">+${f((r.rev/p.rev-1)*100,0)}%</b><span>Revenue growth since peak</span></div><div class="kp"><b style="color:var(--bad)">${f(r.rev>p.rev?(1-r.profit/p.profit)*100:0,0)}%</b><span>Profit lost on higher revenue</span></div></div>
<div class="g"><div class="card"><h2>What each department sees vs. what the company earns (index, ${Q[0]} = 100)</h2>${line([{n:'Leads',v:B.leads,c:DC.Marketing},{n:'Headcount',v:B.hc,c:DC.HR},{n:'Output (orders)',v:R.map(x=>x.o),c:DC.Operations},{n:'Revenue',v:R.map(x=>x.rev),c:DC.Finance},{n:'Net profit',v:R.map(x=>x.profit),c:'#b42318'}],1)}</div>
<div class="card"><h2>Department scorecards: all green, company red</h2><div class="tw"><table><thead><tr><th>Department</th><th>Own KPI</th><th>Target</th><th>${Q[L]}</th><th>Status</th></tr></thead><tbody>${[['Marketing','Leads generated',5500,B.leads[L]],['HR','Headcount vs hiring plan',280,B.hc[L]],['Operations','Orders produced',480,f(r.o)*1===r.o?r.o:Math.round(r.o)],['Finance','Revenue (₹L)',1000,Math.round(r.rev)]].map(a=>`<tr><td><span class="pill" style="background:${DC[a[0]]}">${a[0]}</span></td><td>${a[1]}</td><td>${f(a[2])}</td><td>${f(a[3])}</td><td style="color:var(--ok)">Met</td></tr>`).join('')}<tr><td colspan="3"><b>Company net margin</b></td><td>${f(r.m,1)}%</td><td style="color:var(--bad)">Declining</td></tr></tbody></table></div><p class="sub">Every function hits its own target. None of them tracks the cost one function pushes onto another, which is why nobody sees the loss.</p></div></div>
<div class="card"><h2>Net margin by quarter</h2>${line([{n:'Net margin %',v:R.map(x=>x.m),c:'#b42318'}],0,180)}</div>`}
function wf(){const it=[['Revenue',d('rev')],['COGS',-d('cogs')],['Salaries',-d('sal')],['Overtime',-d('otc')],['Marketing',-d('mk')],['Returns',-d('ret')],['Late delivery',-d('exp')],['Hiring',-d('rec')],['Financing',-d('fin')]],W=640,H=250,n=it.length+2;let run=R[PK].profit,pts=[['Peak',0,run,1]];it.forEach(a=>{pts.push([a[0],run,run+a[1],0]);run+=a[1]});pts.push(['Latest',0,run,1]);const vals=pts.flatMap(p=>[p[1],p[2]]),hi=Math.max(...vals)*1.08,lo=Math.min(0,...vals)*1.1,y=v=>H-26-(v-lo)/(hi-lo)*(H-40),bw=W/n;
return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Profit bridge from peak quarter to latest quarter">${pts.map((p,i)=>{const a=y(Math.max(p[1],p[2])),h=Math.abs(y(p[1])-y(p[2]))||1,c=p[3]?'var(--ac)':p[2]>=p[1]?'var(--ok)':'var(--bad)';return`<rect x="${i*bw+6}" y="${a}" width="${bw-12}" height="${h}" fill="${c}" rx="2"/><text x="${i*bw+bw/2}" y="${H-10}" text-anchor="middle">${p[0]}</text><text x="${i*bw+bw/2}" y="${a-4}" text-anchor="middle" style="fill:var(--ink)">${p[3]?f(p[2]):sg(p[2]-p[1])}</text>`}).join('')}</svg>`}
function rc(){const mx=Math.max(...DRV.map(a=>Math.abs(a[1])));const base=B,bm=k=>base[k].slice(0,5).reduce((a,b)=>a+b)/5;
$('t1').innerHTML=`<div class="g"><div class="card"><h2>Profit bridge: ${Q[PK]} to ${Q[L]} (₹L)</h2>${wf()}<p class="sub">Revenue rose, but costs outside the sales line rose faster.</p></div>
<div class="card"><h2>Ranked cross-functional drivers (₹L impact on profit)</h2>${DRV.map(a=>`<div class="bar"><div>${a[0]}</div><div><i style="width:${Math.abs(a[1])/mx*100}%;background:${a[1]<0?'var(--bad)':'var(--ok)'}"></i></div><b style="text-align:right">${sg(a[1])}</b></div>`).join('')}<p class="sub">Discount, HR, quality and collections together cost ₹${f(D.disc+D.hr+D.qual+D.fin)}L, wiping out the gain from volume.</p></div></div>
<div class="card"><h2>The causal chain the analyst found</h2><div class="chain">${[['Discount campaigns',`${B.disc[PK]}% → ${B.disc[L]}%`],['Demand surge',`Leads ${f(B.leads[PK])} → ${f(B.leads[L])}`],['Plants overloaded',`Utilization ${B.util[PK]}% → ${B.util[L]}%`],['Overtime and burnout',`${B.ot[PK]} → ${B.ot[L]} hrs`],['Attrition',`${B.attr[PK]}% → ${B.attr[L]}%`],['Rushed hiring, less training',`${B.train[PK]} → ${B.train[L]} hrs`],['Quality falls',`Defects ${B.defect[PK]}% → ${B.defect[L]}%`],['Late deliveries and returns',`OTD ${B.otd[PK]}% → ${B.otd[L]}%`],['Customers pay slower',`DSO ${B.dso[PK]} → ${B.dso[L]} days`],['Margin collapses',`${f(R[PK].m,1)}% → ${f(R[L].m,1)}%`]].map((a,i,z)=>`<div class="nd"><b>${a[0]}</b>${a[1]}</div>${i<z.length-1?'<span class="ar">→</span>':''}`).join('')}</div></div>
<div class="card"><h2>Deviation from the Q4’24–Q4’25 baseline (% change)</h2><div class="tw"><table class="hm"><thead><tr><th>Metric</th>${Q.slice(5).map(q=>`<th>${q}</th>`).join('')}</tr></thead><tbody>${M.map(m=>{const b=m[3].slice(0,5).reduce((a,c)=>a+c)/5;return`<tr><td><span class="pill" style="background:${DC[m[2]]}">${m[2]}</span> ${m[1]}</td>${m[3].slice(5).map(v=>{const p=(v/b-1)*100,a=Math.min(.85,Math.abs(p)/90+.1);return`<td style="background:rgba(${(m[0]=='otd'||m[0]=='margin'||m[0]=='train')?'180,35,24':p>0?'180,35,24':'180,35,24'},${a})">${sg(p)}%</td>`}).join('')}</tr>`}).join('')}</tbody></table></div><p class="sub">The shock starts in Q1’26 with discounting, overtime and defects moving together. Delivery and margin follow within two quarters.</p></div>`}
let sel=null;function cr(){const ks=M.map(m=>m[0]);$('t2').innerHTML=`<div class="card"><h2>Cross-functional correlation matrix (8 quarters)</h2><div class="tw"><table class="hm"><thead><tr><th></th>${M.map(m=>`<th title="${m[1]}">${m[1].split(' ')[0].slice(0,6)}</th>`).join('')}</tr></thead><tbody>${M.map((a,i)=>`<tr><td><span class="pill" style="background:${DC[a[2]]}">${a[2][0]}</span> ${a[1]}</td>${M.map((b,j)=>{const r=corr(a[3],b[3]);return`<td data-i="${i}" data-j="${j}" style="background:rgba(${r>0?'31,78,140':'217,119,6'},${Math.abs(r)*.8});color:${Math.abs(r)>.6?'#fff':'var(--ink)'}">${r.toFixed(2)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="sub" id="cx">Click any cell to read the relationship. With 8 data points, treat correlations as clues and check them against the causal chain.</p></div>`;
$('t2').querySelector('tbody').onclick=e=>{const c=e.target.closest('td[data-i]');if(!c)return;const a=M[+c.dataset.i],b=M[+c.dataset.j],r=corr(a[3],b[3]);$('cx').textContent=a===b?`${a[1]} against itself is always 1.`:`${a[1]} (${a[2]}) and ${b[1]} (${b[2]}): r = ${r.toFixed(2)}. ${Math.abs(r)>.9?'A very strong':'A '+(Math.abs(r)>.7?'strong':'weak')} ${r>0?'positive':'negative'} link${a[2]!==b[2]?', across two departments that report separately.':'.'}`}}
const RF={disc:8,attr:12,defect:3,dso:45,mspend:85};let S={disc:14,attr:23,defect:5.8,dso:58,mspend:108};
function cf(o){const lv=1-(14-o.disc)*.018,ord=R[L].o*lv,list=ord*2.4,rev=list*(1-o.disc/100),cogs=list*.38,sal=B.hc[L]*.75,ot=6+(o.attr-8)/15*26,otc=B.hc[L]*ot*3*.0012,ret=list*o.defect/100*.7,otd=95-(o.defect-2)/3.8*11,exp=Math.max(0,(95-otd)*1.5),rec=(22+B.hc[L]*o.attr/400)*.6,fin=rev*o.dso/90*.03,p=rev-cogs-sal-otc-o.mspend-ret-exp-rec-fin-100;return{p,m:p/rev*100,rev}}
const SL=[['disc','Max discount %',5,14,1],['attr','Attrition %',8,23,1],['defect','Defect/return rate %',2,6,.1],['dso','Receivable days',38,58,1],['mspend','Marketing spend ₹L',60,108,2]];
function sm(){$('t3').innerHTML=`<div class="g"><div class="card"><h2>Fix simulator: change one function, see the company result (${Q[L]} base)</h2>${SL.map(s=>`<label for="s_${s[0]}">${s[1]}<output id="o_${s[0]}"></output></label><input type="range" id="s_${s[0]}" min="${s[2]}" max="${s[3]}" step="${s[4]}" value="${S[s[0]]}">`).join('')}<div class="row" style="margin-top:12px"><button id="rf" class="p">Apply recommended plan</button><button id="ra">Reset to actual</button></div></div><div class="card" id="sr"></div></div>`;SL.forEach(s=>$('s_'+s[0]).oninput=e=>{S[s[0]]=+e.target.value;sr()});$('rf').onclick=()=>{S={...RF};sync();sr()};$('ra').onclick=()=>{S={disc:14,attr:23,defect:5.8,dso:58,mspend:108};sync();sr()};sync();sr()}
function sync(){SL.forEach(s=>{$('s_'+s[0]).value=S[s[0]];$('o_'+s[0]).textContent=S[s[0]]})}
function sr(){SL.forEach(s=>$('o_'+s[0]).textContent=S[s[0]]);const c=cf(S),a=cf({disc:14,attr:23,defect:5.8,dso:58,mspend:108}),mx=Math.max(Math.abs(c.p),Math.abs(a.p),R[PK].profit);$('sr').innerHTML=`<h2>Simulated quarterly result</h2><div class="k"><div class="kp"><b style="color:${c.p>a.p?'var(--ok)':'var(--bad)'}">₹${f(c.p)}L</b><span>Net profit</span></div><div class="kp"><b>${f(c.m,1)}%</b><span>Net margin</span></div><div class="kp"><b style="color:var(--ok)">${sg(c.p-a.p)}L</b><span>Gain vs today</span></div></div>${[['Peak quarter (Q4’25)',R[PK].profit],['Today (actual)',a.p],['Simulated plan',c.p]].map((x,i)=>`<div class="bar"><div>${x[0]}</div><div><i style="width:${Math.max(2,Math.abs(x[1])/mx*100)}%;background:${i==2?'var(--ac)':i?'var(--bad)':'var(--ok)'}"></i></div><b style="text-align:right">${f(x[1])}</b></div>`).join('')}<p class="sub">Assumes each discount point removed costs about 1.8% of volume, and attrition drives overtime and defects. Assumed elasticities, so tune them with real data.</p>`}
const say=(t,u)=>{const e=document.createElement('div');e.className='m '+(u?'u':'a');e.textContent=t;$('chat').appendChild(e);$('chat').scrollTop=1e9};
function tab(i){[0,1,2,3].forEach(k=>{$('t'+k).hidden=k!=i;$('tb'+k).className=k==i?'on':''})}
function ask(t){t=t.trim();if(!t)return;say(t,1);const l=t.toLowerCase(),hits=Object.keys(ALIAS).filter(k=>ALIAS[k].test(l));
if(hits.length>=2&&/correl|relat|link|connect|affect/.test(l)){const a=M.find(m=>m[0]==hits[0]),b=M.find(m=>m[0]==hits[1]),r=corr(a[3],b[3]);tab(2);return say(`${a[1]} (${a[2]}) vs ${b[1]} (${b[2]}): r = ${r.toFixed(2)}.\n${a[2]!==b[2]?'These sit in different departments, so neither team sees the other’s side of the relationship.':'Same department.'}\nCaution: 8 quarters is a small sample. The causal chain in the Root cause tab supports the direction.`)}
if(/why|cause|reason|fall|decline|drop/.test(l)){tab(1);return say(`Profit fell from ₹${f(R[PK].profit)}L (${f(R[PK].m,1)}%) to ₹${f(R[L].profit)}L (${f(R[L].m,1)}%) even though revenue grew ${f((R[L].rev/R[PK].rev-1)*100,0)}%.\nThe cause is a chain across departments: deeper discounts (${B.disc[PK]}%→${B.disc[L]}%) lifted demand, plants ran at ${B.util[L]}% utilization, overtime rose to ${B.ot[L]} hrs, attrition hit ${B.attr[L]}% and training fell to ${B.train[L]} hrs. Defects rose to ${B.defect[L]}%, delivery slipped to ${B.otd[L]}% and customers took ${B.dso[L]} days to pay.\nImpact: discounts ${sg(-D.disc)}L, HR cost ${sg(-D.hr)}L, quality ${sg(-D.qual)}L, collections ${sg(-D.fin)}L, offset by ${sg(VOL)}L from volume.`)}
if(/depart|respons|blame|who/.test(l))return say('No single department failed. Each reports a met target: Marketing hit its leads target, HR hit its hiring plan, Operations hit output, and Finance hit revenue. Each one’s success loaded cost onto the next: Marketing’s discounts overloaded Operations, Operations’ overtime drove HR attrition, HR’s rushed hires drove defects, and defects slowed Finance’s collections. The gap is a missing shared metric, such as net margin per order.');
if(/when|start|begin|first|early|lead/.test(l)){const b=M.filter(m=>m[0]!='margin').map(m=>{const bm=m[3].slice(0,5).reduce((a,c)=>a+c)/5,i=m[3].findIndex((v,k)=>k>4&&Math.abs(v/bm-1)>.1);return[m[1],i]}).filter(x=>x[1]>=0);const e=Math.min(...b.map(x=>x[1]));tab(1);return say(`The shock begins in ${Q[e]}. Metrics beyond ±10% of baseline that quarter: ${b.filter(x=>x[1]==e).map(x=>x[0]).join(', ')}.\nLater to breach: ${b.filter(x=>x[1]>e).map(x=>x[0]+' ('+Q[x[1]]+')').join(', ')||'none'}.\nThe discount campaign launched in ${Q[e]} is the likely trigger, because it moved first and everything else followed.`)}
if(/fix|recommend|action|solve|plan/.test(l)){S={...RF};const c=cf(S);tab(3);sm();return say(`Recommended plan (loaded in the simulator): cap discounts near ${RF.disc}%, bring attrition to ${RF.attr}% with retention pay and capped overtime, restore training to cut defects toward ${RF.defect}%, tighten credit terms to ${RF.dso} days and trim marketing spend to ₹${RF.mspend}L.\nSimulated profit: ₹${f(c.p)}L (${f(c.m,1)}%), ${sg(c.p-R[L].profit)}L versus today.\nAlso introduce one shared KPI, net margin per order, owned jointly by all four departments.`)}
if(hits.length==1){const m=M.find(x=>x[0]==hits[0]);return say(`${m[1]} (${m[2]}): ${f(m[3][PK],1)} at the peak, ${f(m[3][L],1)} in ${Q[L]}.\nStrongest links: ${M.filter(x=>x!==m).map(x=>[x[1],corr(m[3],x[3])]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,3).map(x=>x[0]+' ('+x[1].toFixed(2)+')').join(', ')}.`)}
say('I can answer: why profit fell, which department is responsible, when it started, correlations (for example “correlation between overtime and defects”), a single metric (“tell me about attrition”), and “recommend a fix”.')}
const T=['Overview','Root cause','Correlations','Fix simulator'];$('tabs').innerHTML=T.map((t,i)=>`<button id="tb${i}">${t}</button>`).join('');T.forEach((t,i)=>$('tb'+i).onclick=()=>tab(i));
$('go').onclick=()=>{ask($('q').value);$('q').value=''};$('q').onkeydown=e=>{if(e.key=='Enter')$('go').click()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
$('th').onclick=()=>{const e=document.documentElement,dk=e.dataset.theme?e.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;e.dataset.theme=dk?'light':'dark'};
ov();rc();cr();sm();tab(0);
say('I’ve joined Marketing, HR, Operations and Finance data. Profit has dropped three quarters in a row while every department reports a met target. Ask me why, or open the Root cause and Correlations tabs.');
</script></body></html>
